name: day-sheet-render
# Ticket 019 — deterministic tabbed Day Sheet renderer + desk-state snapshot.
# Lives in THIS public repo (unlimited Actions minutes; a 15-min cron in the private
# desk-correspondence repo would blow the free tier the watchlist job was engineered
# around). The renderer script is CANON in desk-correspondence/scripts/ — checked out
# here read-write via DESK_REPO_PAT so the desk-state snapshot can be pushed back.
#
# Every 15 min, ~08:00–23:00 Toronto (GitHub cron is UTC; 11:00–03:59 UTC covers the
# window in both EDT and EST with a harmless shoulder hour). The 22:45 Toronto tick
# also runs the end-of-day Workflow Reports finalizer (gated inside the script).

on:
  schedule:
    - cron: "0,15,30,45 11-23 * * *"
    - cron: "0,15,30,45 0-3 * * *"
  workflow_dispatch: {}

concurrency:
  group: day-sheet-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Skip cleanly (green) until the two secrets are configured.
      - name: Gate on setup
        id: gate
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DESK_REPO_PAT: ${{ secrets.DESK_REPO_PAT }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$DESK_REPO_PAT" ]; then
            echo "::notice::NOTION_TOKEN / DESK_REPO_PAT not set — setup incomplete, skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          repository: junyanboon/desk-correspondence
          token: ${{ secrets.DESK_REPO_PAT }}
          path: desk
          # sparse keeps the private checkout minimal — scripts + snapshot dir only
          sparse-checkout: |
            scripts
            desk-state
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Render Day Sheet + snapshot
        if: steps.gate.outputs.ready == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 desk/scripts/day_sheet_build.py --out new-index.html --state-out desk/desk-state/snapshot.json

      # The Docket — the daily human surface (2026-09-02): every open human item grouped
      # by the skill that clears it. Same reads, same tick, no LLM. Non-fatal: a Docket
      # failure must never block the Day Sheet.
      - name: Render Docket
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 desk/scripts/docket_build.py --out new-docket.html
        # --state-out is provisional; the script names the dated file itself when
        # given a directory-less default — we rename below so "changed?" is easy.

      # The Night Watch — exception console (2026-09-02). Port of the 08:40 LLM publisher
      # (trig_01Y6Jom8Qbq66jy4XzAzRMxD): reads the Concierge's NW-HANDOFF-V1 marker, re-reads
      # each named residual row, reads the open surface direct, fills night-watch's own
      # template.html. SHADOW = committed here as night-watch.html for comparison. LIVE =
      # pushed to junyanboon/night-watch index.html (below). Non-fatal, like the Docket.
      - name: Render Night Watch
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 desk/scripts/night_watch_build.py --out new-night-watch.html

      - name: Publish index.html (change-only, stamp line ignored)
        if: steps.gate.outputs.ready == 'true'
        run: |
          strip_stamp() { sed -E 's/Desk · [^<]*//' "$1"; }
          if [ -f index.html ] && diff -q <(strip_stamp index.html) <(strip_stamp new-index.html) >/dev/null; then
            echo "no content change — not committing"
          else
            mv new-index.html index.html
            git config user.name "day-sheet-bot"
            git config user.email "day-sheet-bot@users.noreply.github.com"
            git add index.html
            git commit -m "Day Sheet $(date -u +%F' '%H:%M) render"
            for i in 1 2 3; do
              git push && break
              git fetch origin main && git rebase -X theirs origin/main || git rebase --abort
              sleep $((i * 3))
            done
          fi

      - name: Publish docket.html (change-only, stamp line ignored)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: |
          [ -f new-docket.html ] || { echo "no docket render — skipping"; exit 0; }
          strip_stamp() { sed -E 's/Toronto · [0-9]+ item[s]? waiting[^<]*//; s/[A-Z][a-z]+ [A-Z][a-z]+ [0-9]+, [0-9]{4} · [0-9]{2}:[0-9]{2}//' "$1"; }
          if [ -f docket.html ] && diff -q <(strip_stamp docket.html) <(strip_stamp new-docket.html) >/dev/null; then
            echo "no docket change — not committing"
          else
            mv new-docket.html docket.html
            git config user.name "day-sheet-bot"
            git config user.email "day-sheet-bot@users.noreply.github.com"
            git add docket.html
            git commit -m "Docket $(date -u +%F' '%H:%M) render"
            for i in 1 2 3; do
              git push && break
              git fetch origin main && git rebase -X theirs origin/main || git rebase --abort
              sleep $((i * 3))
            done
          fi

      - name: Publish night-watch.html (SHADOW — change-only, kicker time ignored)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: |
          [ -f new-night-watch.html ] || { echo "no night-watch render — skipping"; exit 0; }
          strip_stamp() { sed -E 's/Night Watch · [^<]*//; s/re-read live at [0-9:]+ [AP]M//; s/checked [0-9:]+ [AP]M//; s/as of [0-9:]+ [AP]M//g' "$1"; }
          if [ -f night-watch.html ] && diff -q <(strip_stamp night-watch.html) <(strip_stamp new-night-watch.html) >/dev/null; then
            echo "no night-watch change — not committing"
          else
            cp new-night-watch.html night-watch.html
            git config user.name "day-sheet-bot"
            git config user.email "day-sheet-bot@users.noreply.github.com"
            git add night-watch.html
            git commit -m "Night Watch $(date -u +%F' '%H:%M) render (shadow)"
            for i in 1 2 3; do
              git push && break
              git fetch origin main && git rebase -X theirs origin/main || git rebase --abort
              sleep $((i * 3))
            done
          fi

      # LIVE flip — a human decision (Junyan): set repo variable NIGHT_WATCH_LIVE=1 and add
      # secret NIGHT_WATCH_PAT (fine-grained, junyanboon/night-watch, contents:rw). Publishes
      # from 08:40 Toronto onward (the Concierge's 08:10 pass must have filed the marker),
      # change-only, same commit message the LLM used. Before the flip this step is a no-op.
      - name: Publish Night Watch LIVE (junyanboon/night-watch index.html)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          NIGHT_WATCH_PAT: ${{ secrets.NIGHT_WATCH_PAT }}
          NIGHT_WATCH_LIVE: ${{ vars.NIGHT_WATCH_LIVE }}
        run: |
          [ -f new-night-watch.html ] || { echo "no render — skipping"; exit 0; }
          if [ "$NIGHT_WATCH_LIVE" != "1" ] || [ -z "$NIGHT_WATCH_PAT" ]; then
            echo "::notice::Night Watch in SHADOW (NIGHT_WATCH_LIVE=${NIGHT_WATCH_LIVE:-unset}, PAT $([ -n "$NIGHT_WATCH_PAT" ] && echo set || echo unset)) — LLM trigger still publishes."
            exit 0
          fi
          HHMM=$(TZ=America/Toronto date +%H%M)
          if [ "$HHMM" -lt 0840 ]; then echo "before 08:40 Toronto — the marker is not due yet; skipping live publish"; exit 0; fi
          API="https://api.github.com/repos/junyanboon/night-watch/contents/index.html"
          CUR=$(curl -sf -H "Authorization: Bearer $NIGHT_WATCH_PAT" "$API")
          SHA=$(echo "$CUR" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          echo "$CUR" | python3 -c "import json,sys,base64; sys.stdout.write(base64.b64decode(json.load(sys.stdin)['content']).decode())" > live-index.html
          strip_stamp() { sed -E 's/Night Watch · [^<]*//; s/re-read live at [0-9:]+ [AP]M//; s/checked [0-9:]+ [AP]M//; s/as of [0-9:]+ [AP]M//g' "$1"; }
          if diff -q <(strip_stamp live-index.html) <(strip_stamp new-night-watch.html) >/dev/null; then echo "live page unchanged — not publishing"; exit 0; fi
          TODAY=$(TZ=America/Toronto date +%F)
          BODY=$(python3 -c "import base64,json,sys; print(json.dumps({'message':f'Night Watch {sys.argv[1]} — exception console','content':base64.b64encode(open('new-night-watch.html','rb').read()).decode(),'sha':sys.argv[2],'branch':'main'}))" "$TODAY" "$SHA")
          curl -sf -X PUT -H "Authorization: Bearer $NIGHT_WATCH_PAT" -d "$BODY" "$API" >/dev/null && echo "published Night Watch $TODAY to junyanboon/night-watch"

      - name: Push desk-state snapshot (change-only, race-tolerant)
        if: steps.gate.outputs.ready == 'true'
        run: |
          cd desk
          TODAY=$(TZ=America/Toronto date +%F)
          mv desk-state/snapshot.json "desk-state/$TODAY.json"
          git add desk-state/
          if git diff --cached -I '"rebuilt_at"' --quiet; then
            echo "no snapshot change — not committing"
            exit 0
          fi
          git config user.name "day-sheet-bot"
          git config user.email "day-sheet-bot@users.noreply.github.com"
          git commit -m "desk-state: $TODAY snapshot"
          for i in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            git fetch origin main || true
            if ! git rebase -X theirs origin/main; then git rebase --abort 2>/dev/null || true; fi
            sleep $((i * 3))
          done
          echo "::warning::desk-state push lost the race — non-fatal, next run rewrites."
          exit 0

      # Retires the 4 LLM "FBS Monitor tick driver" RemoteTriggers (RUNTIMES.md):
      # bump .rebuild-tick in fbs-monitor so its on:push rebuild fires — deterministic,
      # zero tokens, same 15-min cadence. No-op until FBS_TICK_PAT (fine-grained,
      # junyanboon/fbs-monitor, contents:rw) is added as a secret. Runs even when the
      # render gate is closed — the tick must not depend on Notion setup.
      - name: Tick fbs-monitor rebuild
        if: always()
        continue-on-error: true
        env:
          FBS_TICK_PAT: ${{ secrets.FBS_TICK_PAT }}
        run: |
          if [ -z "$FBS_TICK_PAT" ]; then
            echo "::notice::FBS_TICK_PAT not set — tick skipped (LLM tick drivers still own the beat)."
            exit 0
          fi
          API="https://api.github.com/repos/junyanboon/fbs-monitor/contents/.rebuild-tick"
          SHA=$(curl -sf -H "Authorization: Bearer $FBS_TICK_PAT" "$API" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$(python3 -c "import base64,json,sys; print(json.dumps({'message':'chore: rebuild tick (day-sheet piggyback)','content':base64.b64encode(f'tick {sys.argv[1]}'.encode()).decode(),'sha':sys.argv[2],'branch':'main'}))" "$NOW" "$SHA")
          curl -sf -X PUT -H "Authorization: Bearer $FBS_TICK_PAT" -d "$BODY" "$API" >/dev/null && echo "ticked $NOW"
